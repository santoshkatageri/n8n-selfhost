name: Plan OCI stacks
on:
  push:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/oci-plan.yml', 'scripts/resource_manager_plan.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oci-resource-manager-plan
  cancel-in-progress: false
jobs:
  plan:
    if: vars.OCI_PLAN_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: oci-plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'oci-cli==3.94.1'
      - name: Plan connected stacks without applying
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_STACK_OCID: ${{ secrets.OCI_COMPARTMENT_STACK_OCID }}
          OCI_CONTROLLER_STACK_OCID: ${{ secrets.OCI_CONTROLLER_STACK_OCID }}
        run: python scripts/resource_manager_plan.py
